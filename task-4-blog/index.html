<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header class="header">
        <h1>My Blog</h1>
        <p>Thoughts about tech, travel, and food.</p>
    </header>

    <main class="container">

        
        <div class="filters">
            <button class="filter-btn active" data-category="All">All</button>
            <button class="filter-btn" data-category="Tech">Tech</button>
            <button class="filter-btn" data-category="Travel">Travel</button>
            <button class="filter-btn" data-category="Food">Food</button>
        </div>

        
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search posts by title...">
        </div>

        
        <div class="posts-grid" id="posts-grid"></div>

        <div class="pagination" id="pagination"></div>

    </main>

    <script src="script.js"></script>
</body>
</html>
